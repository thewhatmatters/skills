<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bp-bg: #F0EEE6; --bp-surface: #F7F6F2; --bp-fg: #191917;
    --bp-muted: #6B6A63; --bp-accent: #CC785C; --bp-line: #DEDBD0;
    --bp-boundary-fill: rgba(222,219,208,0.18);
    --bp-serif: "Tiempos Headline", "Source Serif 4", Georgia, serif;
    --bp-sans: "Styrene B", "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bp-bg: #1F1E1B; --bp-surface: #26241F; --bp-fg: #EDEAE0;
    --bp-muted: #A7A498; --bp-accent: #E0937A; --bp-line: #3A372F;
    --bp-boundary-fill: rgba(58,55,47,0.28);
  } }
  :root[data-theme="dark"] {
    --bp-bg: #1F1E1B; --bp-surface: #26241F; --bp-fg: #EDEAE0;
    --bp-muted: #A7A498; --bp-accent: #E0937A; --bp-line: #3A372F;
    --bp-boundary-fill: rgba(58,55,47,0.28);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bp-bg); color: var(--bp-fg);
         font-family: var(--bp-sans); min-height: 100vh; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
           padding: 28px 36px 8px; }
  h1 { font-family: var(--bp-serif); font-size: 1.6rem; font-weight: 600; }
  .desc { color: var(--bp-muted); font-size: 0.95rem; }
  .toolbar { margin-left: auto; display: flex; gap: 8px; }
  .toolbar button { background: var(--bp-surface); color: var(--bp-fg);
    border: 1px solid var(--bp-line); border-radius: 8px; padding: 6px 14px;
    font: 500 13px var(--bp-sans); cursor: pointer; }
  .toolbar button:hover { border-color: var(--bp-accent); color: var(--bp-accent); }
  main { padding: 12px 36px 36px; overflow-x: auto; }
  svg { max-width: 100%; height: auto; display: block; }
  footer { padding: 0 36px 24px; color: var(--bp-muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span class="desc">__DESCRIPTION__</span>
  <div class="toolbar">
    <button id="bp-theme" title="Toggle theme">◐ Theme</button>
    <button id="bp-svg-dl" title="Download SVG">SVG</button>
    <button id="bp-png-dl" title="Download PNG (2×)">PNG 2×</button>
  </div>
</header>
<main>__SVG__</main>
<footer>blueprint · generated __DATE__ · edit the source JSON and re-render — this file is generated output.</footer>
<script>
(function () {
  var root = document.documentElement;
  document.getElementById("bp-theme").addEventListener("click", function () {
    var dark = getComputedStyle(root).getPropertyValue("--bp-bg").trim() === "#1F1E1B";
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  function themedSvg() {
    var svg = document.getElementById("bp-svg").cloneNode(true);
    var cs = getComputedStyle(root);
    var vars = ["--bp-bg", "--bp-surface", "--bp-fg", "--bp-muted",
                "--bp-line", "--bp-boundary-fill", "--bp-sans"];
    var decl = vars.map(function (v) {
      return v + ":" + cs.getPropertyValue(v).trim();
    }).join(";");
    var style = svg.querySelector("style");
    style.textContent = "svg{" + decl + ";background:var(--bp-bg)}" + style.textContent;
    var vb = svg.getAttribute("viewBox").split(" ");
    svg.setAttribute("width", vb[2]); svg.setAttribute("height", vb[3]);
    var bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("width", vb[2]); bg.setAttribute("height", vb[3]);
    bg.setAttribute("fill", cs.getPropertyValue("--bp-bg").trim());
    svg.insertBefore(bg, svg.firstChild.nextSibling);
    return { node: svg, w: +vb[2], h: +vb[3] };
  }

  function download(name, blob) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    a.click(); URL.revokeObjectURL(a.href);
  }

  document.getElementById("bp-svg-dl").addEventListener("click", function () {
    var t = themedSvg();
    var xml = new XMLSerializer().serializeToString(t.node);
    download("diagram.svg", new Blob([xml], { type: "image/svg+xml" }));
  });

  document.getElementById("bp-png-dl").addEventListener("click", function () {
    var t = themedSvg();
    var xml = new XMLSerializer().serializeToString(t.node);
    var img = new Image();
    img.onload = function () {
      var c = document.createElement("canvas");
      c.width = t.w * 2; c.height = t.h * 2;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { download("diagram.png", b); }, "image/png");
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  });
})();
</script>
</body>
</html>
